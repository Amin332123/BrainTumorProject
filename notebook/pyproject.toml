[project]
name = "notebook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amin332123", email = "mohamedaminerahamni6@gamil.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
